name: docker build and healthcheck

permissions:
  contents: read
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    paths:
      - 'resources/docker/**'
      - '.github/workflows/github-docker-build.yml'
  workflow_dispatch:

jobs:
  build-run-healthcheck:
    # skip draft PRs and closed-but-not-merged PRs
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event.action != 'closed' || github.event.pull_request.merged == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: docker-build-${{ github.ref }}
      cancel-in-progress: true
    env:
      IMAGE: xpress-bio:commit-${{ github.event.pull_request.head.sha || github.sha }}
      NAME: xpressbio
      PORT: 3000
      SLEEP_INTERVAL: 3
      # Check at job level since secrets context isn't available in step-level if: expressions
      HAS_DOCKERHUB_CREDS: ${{ vars.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Use PR head SHA to guard against deleted branches on merge
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      
      - name: Is docker installed?
        run: docker --version && docker info

      - name: Extract version from package.json
        id: package_json
        run: |
          VERSION=$(jq -r '.version' resources/docker/app/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Build image (no cache)
        run: |
          docker build --no-cache \
            -t "$IMAGE" \
            -f resources/docker/Dockerfile \
            resources/docker/

      - name: Run container
        run: |
          docker rm -f "$NAME" >/dev/null 2>&1 || true
          docker run -d --name "$NAME" -p ${PORT}:${PORT} "$IMAGE"

      - name: Wait for "Container mode is detected" banner
        run: |
          set -euo pipefail
          start=$(docker inspect -f '{{.State.StartedAt}}' "$NAME")
          if timeout 30s grep -F --line-buffered -m1 'Container mode is detected' < <(docker logs -f --since "$start" "$NAME" 2>&1); then
            echo "OK: Container mode is detected."
          else
            echo "FAIL: Container mode was NOT detected — dumping logs:" >&2
            docker logs --since "$start" "$NAME" || true
            exit 1
          fi

      - name: Wait for /healthcheck
        run: |
          set -e
          for i in {1..5}; do
            if curl -fsS "http://127.0.0.1:${PORT}/healthcheck"; then
              echo "Healthy."
              exit 0
            fi
            echo "Server unresponsive $(( (i - 1) * ${SLEEP_INTERVAL} )) seconds after start; retrying..."
            sleep ${SLEEP_INTERVAL}
          done
          echo "Timed out waiting for /healthcheck"
          docker logs "$NAME" || true
          exit 1

      - name: Login to DockerHub
        if: github.event.pull_request.merged == true && env.HAS_DOCKERHUB_CREDS == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and Push to DockerHub
        if: github.event.pull_request.merged == true && env.HAS_DOCKERHUB_CREDS == 'true'
        run: |
          DOCKERHUB_IMAGE="${{ vars.DOCKERHUB_USERNAME }}/xpress-bio"
          VERSION="${{ steps.package_json.outputs.version }}"
          SHORT_SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${SHORT_SHA::7}"
          
          docker tag "$IMAGE" "${DOCKERHUB_IMAGE}:latest"
          docker tag "$IMAGE" "${DOCKERHUB_IMAGE}:v${VERSION}"
          docker tag "$IMAGE" "${DOCKERHUB_IMAGE}:v${VERSION}-${SHORT_SHA}"
          
          docker push "${DOCKERHUB_IMAGE}:latest"
          docker push "${DOCKERHUB_IMAGE}:v${VERSION}"
          docker push "${DOCKERHUB_IMAGE}:v${VERSION}-${SHORT_SHA}"
          
          echo "Pushed tags:"
          echo "  - ${DOCKERHUB_IMAGE}:latest"
          echo "  - ${DOCKERHUB_IMAGE}:v${VERSION}"
          echo "  - ${DOCKERHUB_IMAGE}:v${VERSION}-${SHORT_SHA}"

      - name: Cleanup
        if: always()
        run: docker rm -f "$NAME" || true
